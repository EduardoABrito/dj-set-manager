<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neon-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bd00ff;stop-opacity:1" />
    </linearGradient>
    
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur5"/>
      <feMerge>
        <feMergeNode in="blur5"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(40, 50)" filter="url(#neon-glow)">
    <path d="M 10,50 L 30,50 L 45,10 L 65,90 L 85,30 L 105,50 L 130,50" 
          fill="none" 
          stroke="url(#neon-gradient)" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="180" y="95" 
          font-size="60" 
          font-weight="800" 
          fill="url(#neon-gradient)"
          filter="url(#neon-glow)"
          letter-spacing="2">
      SyncWave
    </text>
    
    <text x="185" y="135" 
          font-size="24" 
          font-weight="400" 
          fill="#a0a0b0"
          letter-spacing="1">
      DJ SET MANAGEMENT
    </text>
  </g>
</svg>